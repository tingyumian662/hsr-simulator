<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星穹铁道战斗模拟器</title>
<link rel="stylesheet" href="/static/style.css?v=20260829-1">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/><path d="M19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/></svg>
    </div>
    <div class="brand-copy">
      <div class="brand-kicker">Combat Analysis Terminal</div>
      <h1>星穹铁道战斗模拟器</h1>
    </div>
  </div>
  <div class="header-status">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="status-label">队伍状态</span>
    <strong id="team-count">0 / 4</strong>
  </div>
</header>
<div id="app">
<div class="panel" id="left">
  <div class="panel-heading">
    <div><h2>队伍配置</h2><p>角色、光锥与遗器面板</p></div>
    <span class="panel-count">04 SLOTS</span>
  </div>
  <div id="team-slots"></div>
</div>
<div class="panel" id="mid">
  <div class="panel-heading">
    <div><h2>敌人 & 模拟</h2><p>战斗环境参数</p></div>
  </div>
  <div class="card enemy-card">
    <h3 class="section-title">敌方配置（逐只独立）</h3>
    <div id="enemy-list"></div>
    <button id="btn-add-enemy" type="button" onclick="addEnemyCard({})">+ 添加敌人</button>
    <label class="field"><span>行动值上限 AV</span><input id="max-av" value="200" type="number"></label>
    <button id="btn-sim" onclick="runSim()">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 4 13 8-13 8V4Z"/></svg>
      <span>开始模拟</span>
    </button>
    <div id="sim-status" aria-live="polite">等待配置</div>
  </div>
  <div class="card summary-card" id="summary-panel" style="display:none">
    <h3 class="section-title">伤害汇总</h3>
    <div id="summary-content"></div>
  </div>
</div>
<div class="panel" id="right">
  <div id="tab-bar">
    <span class="tab active" onclick="switchTab('log')"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>战斗日志</span>
    <span class="log-badge" id="log-count">0 EVENTS</span>
  </div>
  <div id="log-container">
    <div class="log-empty">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/></svg>
      <span>完成队伍配置后开始模拟</span>
    </div>
  </div>
</div>
</div>

<script src="/static/app.js?v=20260904-1"></script>
</body>
</html>
